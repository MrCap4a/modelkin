name: modelkin

# Local development stack (ТЗ §35-36): `docker compose up` alone gives a
# developer everything needed to run the app — Next.js in dev mode with hot
# reload, PostgreSQL, and a local S3-compatible store (MinIO). Production
# uses the standalone image built from ./Dockerfile instead — see
# docker-compose.prod.yml and DEPLOYMENT.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: modelkin
      POSTGRES_PASSWORD: modelkin
      POSTGRES_DB: modelkin
    ports:
      # Overridable in case port 5432 is already taken by a local Postgres
      # install: set POSTGRES_HOST_PORT in your (gitignored) .env.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelkin -d modelkin"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: modelkin
      MINIO_ROOT_PASSWORD: modelkin-secret
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    # Bucket is private by default; previews/ and avatars/ are display
    # assets served as plain <img src> and are made public-read so the app
    # doesn't have to presign a URL per thumbnail on every catalog render.
    # models/ (STL) and custom-orders/ (customer-submitted files) stay
    # private — those are only ever served through a signed, ownership- or
    # admin-checked URL (@modules/downloads, @modules/custom-orders).
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 modelkin modelkin-secret &&
      (mc mb local/modelkin || true) &&
      mc anonymous set none local/modelkin &&
      mc anonymous set download local/modelkin/previews &&
      mc anonymous set download local/modelkin/avatars
      "

  # One-shot: installs node_modules + generates the Prisma client into the
  # shared `app-node-modules` volume exactly once. `app` and `worker` both
  # bind-mount that same volume and used to each run their own `npm
  # install` concurrently on container start — two npm processes racing to
  # write/execute the same binaries (e.g. esbuild's postinstall) in one
  # volume reliably corrupted it (ETXTBSY errors, and once corrupted, `npx
  # prisma` silently fell back to fetching an unrelated, incompatible
  # latest-major Prisma version instead of using the project's pinned one).
  # Depending on this service's clean exit instead fixes both problems.
  deps:
    image: node:20-alpine
    working_dir: /app
    # Prisma's engine binaries dynamically link against OpenSSL, which the
    # bare node:20-alpine image doesn't include (unlike ./Dockerfile's
    # production image, which installs it explicitly) — without it, Prisma
    # falls back to guessing an OpenSSL version and the schema engine fails
    # outright ("Could not parse schema engine response").
    command: sh -c "apk add --no-cache openssl && npm install && npx prisma generate"
    env_file: .env
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
    restart: "no"

  app:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "apk add --no-cache openssl && npx prisma migrate deploy && npm run dev"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://modelkin:modelkin@postgres:5432/modelkin?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_HOST_FOR_CSP: http://localhost:9000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
      - app-next-cache:/app/.next
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "apk add --no-cache openssl && npm run worker"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://modelkin:modelkin@postgres:5432/modelkin?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_HOST_FOR_CSP: http://localhost:9000
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  app-node-modules:
  app-next-cache:
