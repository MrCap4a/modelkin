name: CI

on:
  pull_request:
  push:
    branches: [master]

env:
  DATABASE_URL: postgresql://modelkin:modelkin@localhost:5432/modelkin_test?schema=public
  APP_URL: http://localhost:3000
  S3_ENDPOINT: http://localhost:9000
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: modelkin
  S3_SECRET_ACCESS_KEY: modelkin-secret
  S3_BUCKET: modelkin-test
  S3_FORCE_PATH_STYLE: "true"
  MAIL_FROM: no-reply@modelkin.ru
  MAIL_PROVIDER: console

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modelkin
          POSTGRES_PASSWORD: modelkin
          POSTGRES_DB: modelkin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U modelkin -d modelkin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modelkin
          POSTGRES_PASSWORD: modelkin
          POSTGRES_DB: modelkin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U modelkin -d modelkin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # No `minio` entry here (unlike `postgres` above): GitHub Actions
    # `services:` containers always run with the image's baked-in default
    # command and cannot be given `command:`/`args:` the way docker-compose
    # allows — MinIO's official image needs `server /data` as its command
    # to actually start (verified locally: with no command it just prints
    # --help and exits 0), so it can't be run as a `services:` entry at
    # all. Started as a plain `docker run` step below instead, matching
    # docker-compose.yml's dev `minio` service exactly (same image, same
    # command) rather than the unrelated `bitnami/minio` image this job
    # used before — that image's `:latest` tag stopped resolving after
    # Bitnami's 2025 move of its free-tier images off the `bitnami/`
    # namespace, and pinning an old tag there risks the same rot again.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prisma generate + migrate
        run: |
          npx prisma generate
          npx prisma migrate deploy

      # Same image + command as the dev `minio` service in docker-compose.yml.
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=modelkin \
            -e MINIO_ROOT_PASSWORD=modelkin-secret \
            quay.io/minio/minio:latest server /data --console-address ":9001"
          timeout 30 sh -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done'

      # Mirrors docker-compose.yml's `minio-init` service: creates the
      # bucket and makes previews/avatars public-read (the app serves
      # those as plain <img src>, never through a presigned URL).
      - name: Create MinIO bucket
        run: |
          docker run --rm --network host --entrypoint sh quay.io/minio/mc:latest -c "
            mc alias set local http://localhost:9000 modelkin modelkin-secret &&
            mc mb local/modelkin-test &&
            mc anonymous set none local/modelkin-test &&
            mc anonymous set download local/modelkin-test/previews &&
            mc anonymous set download local/modelkin-test/avatars
          "

      - name: Seed database
        run: npm run db:seed

      - name: Build
        run: npm run build

      # playwright.config.ts deliberately sets `webServer: undefined` when
      # `CI` is set — its own comment says the workflow is expected to
      # start the app itself, but this job never did, so every E2E test
      # failed with ERR_CONNECTION_REFUSED. `next start` forces
      # NODE_ENV=production regardless of the shell env (verified locally:
      # even with NODE_ENV=development set beforehand, the prod-only HSTS
      # header still came back) — that makes the session cookie `Secure`,
      # but Chrome (and Playwright's Chromium) treats http://localhost as
      # a secure context and sends Secure cookies there anyway, so this
      # doesn't break login/session-dependent E2E flows.
      - name: Start application
        run: |
          nohup npm run start > /tmp/modelkin-next.log 2>&1 &
          echo $! > /tmp/modelkin-next.pid

      - name: Wait for application
        run: |
          timeout 60 sh -c '
            until curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; do
              sleep 1
            done
          '

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Dump application logs
        if: failure()
        run: cat /tmp/modelkin-next.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Publishes to GitHub Container Registry so a server deploy can just
  # `docker pull` a known-good, already-tested image instead of rebuilding
  # from source on the server (see DEPLOYMENT.md). Gated on both prior jobs
  # and on being an actual push to master (not a pull_request, and not a PR
  # from a fork, which wouldn't have push access to ghcr.io anyway) — never
  # publish an image that hasn't passed every check.
  publish-image:
    runs-on: ubuntu-latest
    needs: [build-and-test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io requires a lowercase image path; github.repository preserves
      # the owner/repo casing as typed on GitHub (e.g. "MrCap4a/modelkin").
      - name: Compute lowercase image name
        id: vars
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Web app — Dockerfile's `runner` stage (see docker-compose.prod.yml's
      # `app` service, which now also pins this explicitly — building with
      # no --target defaults to the *last* stage in the Dockerfile, which is
      # `worker`, not `runner`; confirmed by actually building it that way).
      - name: Build and push app image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Background worker — Dockerfile's `worker` stage. Separate image
      # (not just a different tag of the app image) since it's a distinct
      # runtime role with a different entrypoint/CMD, matching
      # docker-compose.prod.yml's `worker` service.
      - name: Build and push worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}-worker:latest
            ${{ steps.vars.outputs.image }}-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
