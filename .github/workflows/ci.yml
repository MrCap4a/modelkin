name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: postgresql://modelkin:modelkin@localhost:5432/modelkin_test?schema=public
  APP_URL: http://localhost:3000
  S3_ENDPOINT: http://localhost:9000
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: modelkin
  S3_SECRET_ACCESS_KEY: modelkin-secret
  S3_BUCKET: modelkin-test
  S3_FORCE_PATH_STYLE: "true"
  MAIL_FROM: no-reply@modelkin.ru
  MAIL_PROVIDER: console

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modelkin
          POSTGRES_PASSWORD: modelkin
          POSTGRES_DB: modelkin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U modelkin -d modelkin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modelkin
          POSTGRES_PASSWORD: modelkin
          POSTGRES_DB: modelkin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U modelkin -d modelkin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: modelkin
          MINIO_ROOT_PASSWORD: modelkin-secret
          MINIO_DEFAULT_BUCKETS: modelkin-test
        ports: ["9000:9000"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prisma generate + migrate
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Seed database
        run: npm run db:seed

      - name: Build
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
